<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">From disclosure to testable evidence</title>
  <desc id="pipeline-desc">The completed research path aligns official financial disclosures, builds character-bigram TF-IDF with metadata and market-state features, and evaluates ridge models with matched ablations against 5, 20 and 60-session CSI 300 excess returns and overlap checks. A separate dashed path marks the prepared, source-grounded 15-field LLM schema with inference pending. The evidence snapshot is a five-stock provisional cohort.</desc>
  <defs>
    <marker id="main-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 7 4 1 7" fill="none" stroke="#087f8c" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <marker id="future-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 7 4 1 7" fill="none" stroke="#bf6a3b" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="16" fill="#f7f6f0"/>
  <text x="40" y="61" fill="#172b3a" font-family="Georgia, 'Times New Roman', serif" font-size="39" letter-spacing="-0.7">From disclosure to testable evidence</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17">
    <path d="M42 98H74" stroke="#087f8c" stroke-width="2.2"/>
    <text x="86" y="104" fill="#172b3a">Completed research path</text>
    <path d="M346 98H379" stroke="#bf6a3b" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="391" y="104" fill="#172b3a">Prepared semantic path</text>
  </g>

  <!-- Completed baseline path. Arrows indicate processing, not causal effects. -->
  <g fill="#fffefa" stroke="#cbd5d1" stroke-width="1.2">
    <rect x="40" y="144" width="190" height="194" rx="9"/>
    <rect x="252" y="144" width="210" height="194" rx="9"/>
    <rect x="484" y="144" width="234" height="194" rx="9"/>
    <rect x="740" y="144" width="174" height="194" rx="9"/>
    <rect x="936" y="144" width="224" height="194" rx="9"/>
  </g>
  <g stroke="#087f8c" stroke-width="3">
    <path d="M55 145H96M267 145H308M499 145H540M755 145H796M951 145H992"/>
  </g>
  <g stroke="#087f8c" stroke-width="1.6" fill="none" marker-end="url(#main-arrow)">
    <path d="M231 242H250"/><path d="M463 242H482"/><path d="M719 242H738"/><path d="M915 242H934"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <g fill="#087f8c" font-size="14" font-weight="700" letter-spacing="1.8">
      <text x="58" y="179">01 / SOURCES</text>
      <text x="270" y="179">02 / ALIGNMENT</text>
      <text x="502" y="179">03 / FEATURES</text>
      <text x="758" y="179">04 / MODELS</text>
      <text x="954" y="179">05 / EVALUATION</text>
    </g>
    <g fill="#172b3a" font-size="22" font-weight="700">
      <text x="58" y="218">Official</text><text x="58" y="245">disclosures</text>
      <text x="270" y="218">Provenance</text><text x="270" y="245">+ time alignment</text>
      <text x="502" y="218">Char-bigram</text><text x="502" y="245">TF-IDF</text>
      <text x="758" y="218">Ridge</text>
      <text x="954" y="218">5 / 20 / 60</text><text x="954" y="245">sessions</text>
    </g>
    <g fill="#53666e" font-size="18">
      <text x="58" y="281">Reports, forecasts</text><text x="58" y="306">&amp; earnings flashes</text>
      <text x="270" y="281">Source → available</text><text x="270" y="306">→ tradable time</text>
      <text x="502" y="281">+ metadata</text><text x="502" y="306">+ market state</text>
      <text x="758" y="257">Matched</text><text x="758" y="282">ablations</text>
      <text x="954" y="281">CSI 300 excess returns</text><text x="954" y="306">+ overlap checks</text>
    </g>
  </g>

  <!-- Prepared future path, separated by line pattern, color and explicit status. -->
  <path d="M357 339V441H482" fill="none" stroke="#bf6a3b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#future-arrow)"/>
  <text x="40" y="417" fill="#53666e" font-family="Arial, Helvetica, sans-serif" font-size="18">Current + prior documents</text>
  <text x="40" y="444" fill="#53666e" font-family="Arial, Helvetica, sans-serif" font-size="18">Strictly dated context</text>
  <rect x="484" y="390" width="676" height="108" rx="9" fill="#f3ebe2" stroke="#bf6a3b" stroke-width="1.2" stroke-dasharray="6 5"/>
  <path d="M601 389V341" fill="none" stroke="#bf6a3b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#future-arrow)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="504" y="417" fill="#9a502b" font-size="14" font-weight="700" letter-spacing="1.6">PREPARED · INFERENCE PENDING</text>
    <text x="504" y="447" fill="#172b3a" font-size="22" font-weight="700">Source-grounded 15-field LLM schema</text>
    <text x="504" y="477" fill="#53666e" font-size="18">Quoted evidence · nullable features · semantic extraction</text>
  </g>
  <path d="M40 518H1160" stroke="#172b3a" stroke-width="1" opacity="0.16"/>
  <text x="40" y="544" fill="#53666e" font-family="Arial, Helvetica, sans-serif" font-size="17"><tspan fill="#087f8c" font-weight="700">EVIDENCE SNAPSHOT</tspan><tspan dx="16">5-stock provisional cohort · CSI 300 benchmark</tspan></text>
</svg>
